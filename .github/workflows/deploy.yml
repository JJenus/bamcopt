name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (UI must not call the API directly)
        run: pnpm lint:api

      - name: Smoke tests (SQLite)
        run: pnpm test

      - name: Smoke tests with OTP off (SQLite)
        run: pnpm test:otp-off

      - name: Migration tests (SQLite)
        run: |
          mkdir -p /tmp/opencode
          pnpm test:migrations

      - name: Build
        run: pnpm build

      - name: Package release
        run: |
          mkdir release
          cp -r .output release/.output
          cp scripts/start-alwaysdata.sh release/start.sh
          tar -C release -czf release.tgz .

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tgz
          retention-days: 7

  deploy:
    name: Deploy to alwaysdata
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.ALWAYSDATA_SSH_HOST }}
      SSH_USER: ${{ secrets.ALWAYSDATA_SSH_USER }}
      APP_DIR: ${{ vars.ALWAYSDATA_APP_DIR || 'bamcopt' }}
      KEEP_RELEASES: 5
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.ALWAYSDATA_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ALWAYSDATA_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -t ed25519,rsa "$SSH_HOST" > ~/.ssh/known_hosts
          fi

      - name: Run database migrations
        env:
          DB_HOST: ${{ secrets.ALWAYSDATA_DB_HOST }}
          DB_PORT: ${{ vars.ALWAYSDATA_DB_PORT || '5432' }}
          DB_NAME: ${{ secrets.ALWAYSDATA_DB_NAME }}
          DB_USER: ${{ secrets.ALWAYSDATA_DB_USER }}
          DB_PASSWORD: ${{ secrets.ALWAYSDATA_DB_PASSWORD }}
          DB_SSL: ${{ vars.ALWAYSDATA_DB_SSL || 'false' }}
          MIGRATION_ENV_FILE: "-"
          NODE_ENV: production
        run: |
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          export PGPASSWORD="$DB_PASSWORD" PGCONNECT_TIMEOUT=15
          [ "$DB_SSL" = "true" ] && export PGSSLMODE=require
          has_users=$(psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -tAc "select to_regclass('public.users') is not null")
          if [ "$has_users" != "t" ]; then
            echo "Fresh database (no users table): skipping migrations; the app creates the schema with DB_SYNC=true on first start."
            echo "Set DB_SYNC=false afterwards. The next deploy adopts the existing tables via the migrations."
            exit 0
          fi
          pnpm db:migrate:status
          pnpm db:migrate

      - name: Upload release
        run: |
          ssh "$SSH_USER@$SSH_HOST" "mkdir -p \"\$HOME/$APP_DIR/releases\""
          scp release.tgz "$SSH_USER@$SSH_HOST:$APP_DIR/releases/${GITHUB_SHA}.tgz"

      - name: Activate release and restart
        run: |
          ssh "$SSH_USER@$SSH_HOST" "APP_DIR='$APP_DIR' SHA='$GITHUB_SHA' KEEP='$KEEP_RELEASES' sh -s" <<'REMOTE'
          set -eu
          cd "$HOME/$APP_DIR"
          mkdir -p "releases/$SHA"
          tar -xzf "releases/$SHA.tgz" -C "releases/$SHA"
          rm -f "releases/$SHA.tgz"
          chmod +x "releases/$SHA/start.sh"

          # atomic switch of the `current` symlink
          ln -sfn "releases/$SHA" current.new
          mv -T current.new current

          # keep the newest $KEEP releases
          ls -1dt releases/*/ | tail -n +"$((KEEP + 1))" | xargs -r rm -rf
          echo "Deployed $SHA"
          REMOTE

      - name: Restart site (alwaysdata API)
        env:
          API_TOKEN: ${{ secrets.ALWAYSDATA_API_TOKEN }}
          SITE_ID: ${{ secrets.ALWAYSDATA_SITE_ID }}
        run: |
          if [ -z "$API_TOKEN" ] || [ -z "$SITE_ID" ]; then
            echo "::warning title=Manual restart needed::ALWAYSDATA_API_TOKEN / ALWAYSDATA_SITE_ID not set: restart the site from the alwaysdata dashboard."
            exit 0
          fi
          curl -fsS -X POST -u "$API_TOKEN account=$SSH_USER:" "https://api.alwaysdata.com/v1/site/$SITE_ID/restart/"
          echo "restart requested"

      - name: Health check (API up and serving this build)
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then echo "HEALTH_URL not set, skipping"; exit 0; fi
          SITE="${HEALTH_URL%/api}"
          expected=$(tar -xzOf release.tgz ./.output/public/_nuxt/builds/latest.json | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          echo "expected build id: $expected"
          for i in $(seq 1 20); do
            api=$(curl -fsS --max-time 10 "$HEALTH_URL" 2>/dev/null || true)
            live=$(curl -fsS --max-time 10 "$SITE/_nuxt/builds/latest.json" 2>/dev/null | python3 -c 'import sys,json;print(json.load(sys.stdin).get("id",""))' 2>/dev/null || true)
            echo "attempt $i: api='${api:-none}' live build='${live:-none}'"
            if echo "$api" | grep -q 'api - v1' && [ "$live" = "$expected" ]; then echo "healthy: new build is live"; exit 0; fi
            sleep 6
          done
          echo "The site is not serving the new build. If api is ok but the build id differs, the old process is still running: restart the site from the alwaysdata dashboard (or set ALWAYSDATA_API_TOKEN and ALWAYSDATA_SITE_ID to automate it)."
          exit 1

      - name: Diagnose (on failure)
        if: failure()
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          report=$(ssh "$SSH_USER@$SSH_HOST" "cd \"\$HOME/$APP_DIR\" 2>/dev/null && echo \"current -> \$(readlink current)\" && ls -1t releases | head -3 | tr '\n' ' '; echo; echo '--- processes'; ps -u \$(id -u) -o pid,etime,args | cut -c1-160; echo '--- home'; ls \$HOME | tr '\n' ' '" 2>&1 || true)
          live=$(curl -sI --max-time 10 "${HEALTH_URL%/api}/" | head -8 | tr -d '\r')
          home=$(curl -s --max-time 10 "${HEALTH_URL%/api}/" | head -c 300 | tr '\n' ' ')
          msg=$(printf '%s\n--- live headers\n%s\n--- live body\n%s' "$report" "$live" "$home")
          msg="${msg//'%'/'%25'}"; msg="${msg//$'\n'/'%0A'}"
          echo "::notice title=deploy-diagnostics::$msg"
