name: CI/CD

on:
  push:
    branches: [fullstack-nuxt]
  pull_request:
    branches: [fullstack-nuxt]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (UI must not call the API directly)
        run: pnpm lint:api

      - name: Smoke tests (SQLite)
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Package release
        run: |
          mkdir release
          cp -r .output release/.output
          cp scripts/start-alwaysdata.sh release/start.sh
          tar -C release -czf release.tgz .

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tgz
          retention-days: 7

  deploy:
    name: Deploy to alwaysdata
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.ALWAYSDATA_SSH_HOST }}
      SSH_USER: ${{ secrets.ALWAYSDATA_SSH_USER }}
      APP_DIR: ${{ vars.ALWAYSDATA_APP_DIR || 'bamcopt' }}
      KEEP_RELEASES: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.ALWAYSDATA_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.ALWAYSDATA_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -t ed25519,rsa "$SSH_HOST" > ~/.ssh/known_hosts
          fi

      - name: Upload release
        run: |
          ssh "$SSH_USER@$SSH_HOST" "mkdir -p \"\$HOME/$APP_DIR/releases\""
          scp release.tgz "$SSH_USER@$SSH_HOST:$APP_DIR/releases/${GITHUB_SHA}.tgz"

      - name: Activate release and restart
        run: |
          ssh "$SSH_USER@$SSH_HOST" "APP_DIR='$APP_DIR' SHA='$GITHUB_SHA' KEEP='$KEEP_RELEASES' sh -s" <<'REMOTE'
          set -eu
          cd "$HOME/$APP_DIR"
          mkdir -p "releases/$SHA"
          tar -xzf "releases/$SHA.tgz" -C "releases/$SHA"
          rm -f "releases/$SHA.tgz"
          chmod +x "releases/$SHA/start.sh"

          # atomic switch of the `current` symlink
          ln -sfn "releases/$SHA" current.new
          mv -T current.new current

          # stop the running app; alwaysdata starts it again on the next request
          pkill -u "$(id -u)" -f 'node .*\.output/server/index\.mjs' || true

          # keep the newest $KEEP releases
          ls -1dt releases/*/ | tail -n +"$((KEEP + 1))" | xargs -r rm -rf
          echo "Deployed $SHA"
          REMOTE

      - name: Health check
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then echo "HEALTH_URL not set, skipping"; exit 0; fi
          for i in $(seq 1 15); do
            if curl -fsS --max-time 10 "$HEALTH_URL" | grep -q 'api - v1'; then
              echo "healthy"; exit 0
            fi
            echo "attempt $i: not ready"; sleep 6
          done
          echo "Health check failed for $HEALTH_URL"; exit 1
